org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Single source of truth for the app version. CI and the release build read these.
# Stable tag = v<appVersionName>; beta tag = v<appVersionName>-beta.<run>. Bump after
# each stable release — the Stable release workflow refuses to tag an existing version.
appVersionName=1.2.0
appVersionCode=3