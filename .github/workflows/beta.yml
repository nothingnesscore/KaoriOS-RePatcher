name: Beta prerelease

# WIP track. Cut a prerelease from main after the same checkpoint the stable workflow
# uses (full Gradle build + engine test suite), but tagged v<appVersionName>-beta.<run>
# and published as a prerelease with a friendly warning, so testers can find bugs early.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties

      - name: Read version from gradle.properties
        id: ver
        run: |
          echo "version=$(grep '^appVersionName=' gradle.properties | cut -d= -f2 | tr -d '\r\n')" >> "$GITHUB_OUTPUT"
          echo "code=$(grep '^appVersionCode=' gradle.properties | cut -d= -f2 | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - name: Checkpoint - full build and test suite must be green
        run: ./gradlew build :engine:jvmTest --console=plain

      - name: Build beta APK
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          BASE: ${{ steps.ver.outputs.version }}
          RUN: ${{ github.run_number }}
        run: |
          VER="${BASE}-beta.${RUN}"
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            ./gradlew :app:assembleRelease \
              "-PappVersionName=$VER" \
              "-Pks.storeFile=$RUNNER_TEMP/release.jks" \
              "-Pks.storePassword=$KS_PASSWORD" \
              "-Pks.keyAlias=$KS_ALIAS" \
              "-Pks.keyPassword=$KS_KEY_PASSWORD" \
              --console=plain
            APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          else
            ./gradlew :app:assembleDebug "-PappVersionName=$VER" --console=plain
            APK="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          fi
          cp "$APK" "Kaorios-RePatcher-${VER}.apk"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "SHA256=$(sha256sum "Kaorios-RePatcher-${VER}.apk" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          cat > notes.md <<EOF
          ## Kaorios RePatcher ${VER} - beta preview (work in progress)

          **Heads up: this is a WIP build, not a stable one.** It is cut from the latest
          main branch only after the full Gradle build and the engine test suite passed
          (the checkpoint every release runs), but it has not had the stability soak a
          stable release gets. Rough edges are expected - that is the point of this track.

          **Version:** ${VER} (versionCode ${CODE}, beta of ${BASE})
          **SHA-256:** ${SHA256}

          ### Before installing
          - If the installer refuses as an upgrade, the previous build was signed with a
            different key: uninstall first, then install this one.
          - Flashing a module is still the riskiest step you take. The module checks your
            ROM digests and aborts on a mismatch, but keep a way back before you start.

          ### Help us find bugs
          Install it, use it for real, and if anything misbehaves open an issue with:
          what you were doing, your Android/HyperOS version family, and the matching lines
          from "adb logcat -s KaoriosPatcher". Early reports on betas are exactly what
          turn them into stables.
          EOF
          # Only the newest changelog entry - a beta's notes stay short, and the compiled
          # history since the previous stable rides on that stable instead. The entry must
          # belong to this version line (written when bumping gradle.properties); the beta
          # run number is dynamic, so match on the base version, not the full tag.
          printf '\n---\n\n' >> notes.md
          head_line="$(grep -m1 '^## \[' CHANGELOG.md || true)"
          case "$head_line" in
            *"[v${BASE}]"*|*"[v${BASE}-"*) ;;
            *)
              echo "::error::newest CHANGELOG.md section is not for v${BASE}. Write it when bumping gradle.properties."
              exit 1
              ;;
          esac
          awk '/^## \[/ { n++; if (n > 1) exit } n > 0 { print }' CHANGELOG.md \
            | sed -e 's/^#### /##### /' -e 's/^### /#### /' -e 's/^## /### /' >> notes.md
          gh release create "v${VER}" --prerelease \
            --title "Kaorios RePatcher ${VER} (beta)" \
            --notes-file notes.md \
            "Kaorios-RePatcher-${VER}.apk"
